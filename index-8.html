  <!-- Startup safety net: if script.js fails, show why instead of spinning forever. -->
  <script>
    (function () {
      var msg = document.getElementById('loader-msg');
      function showError(text) {
        if (msg) msg.textContent = text;
        var bar = document.querySelector('.loader-bar');
        if (bar) bar.hidden = true;
      }
      window.addEventListener('error', function (e) {
        showError('Could not start: ' + (e.message || 'script error'));
      });
      setTimeout(function () {
        if (!window.BL_STARTED) {
          showError('Still loading. If this stays, the script did not run. Open the file from its folder and check that script.js and style.css are in the same folder.');
